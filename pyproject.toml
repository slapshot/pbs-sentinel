[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbs-sentinel"
version = "0.1.0.dev0"
description = "Read-only PBS datastore audit and garbage-collection incident triage"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "PBS Sentinel contributors" }]
keywords = ["proxmox", "pbs", "backup", "audit", "incident-response"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving :: Backup",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
]

[project.scripts]
pbs-sentinel = "pbs_sentinel.cli:main"
pbs-sentinel-web = "pbs_sentinel.web:main"

[tool.setuptools.packages.find]
where = ["src"]
